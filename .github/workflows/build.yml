name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Le jeton du workflow ne sert qu'a lire la caisse. Sans cette ligne, un
# depot configure en « read and write » donnerait a chaque etape — y compris
# aux binaires telecharges plus bas — de quoi pousser sur la branche.
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Actions epinglees par SHA, jamais par etiquette.
#
# `actions/checkout@v4` designe ce que le proprietaire du depot appelle « v4 »
# aujourd'hui: une etiquette se deplace, et un compte compromis la deplacerait
# sans que rien ici ne change. Un SHA, lui, nomme un arbre precis. Le
# commentaire garde la version lisible; c'est lui qu'on met a jour a la main,
# apres avoir regarde le diff.
# ---------------------------------------------------------------------------

jobs:
  checks:
    name: Format, lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb-xkb-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

      # Les metadonnees des logitheques sont un fichier qu'aucun test Rust ne
      # touche: une faute de frappe n'apparaitrait qu'apres installation, dans
      # Discover. On les valide donc ici, avec les outils de reference.
      - name: Metadonnees des logitheques
        run: |
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          desktop-file-validate packaging/sshpass-gui.desktop
          appstreamcli validate --no-net --pedantic \
            packaging/io.github.memton80.sshpass-gui.metainfo.xml
          # La version annoncee aux logitheques doit suivre celle de la caisse,
          # sinon la logitheque affiche une version et le paquet une autre.
          crate=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if ! grep -q "<release version=\"$crate\"" \
              packaging/io.github.memton80.sshpass-gui.metainfo.xml; then
            echo "::error::metainfo sans entree <release> pour la version $crate"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Audit des dependances.
  #
  # `cargo fmt`, `clippy` et les tests ne disent rien d'une faille publiee dans
  # une caisse tierce: le code compile et passe, vulnerable. Pour un logiciel
  # qui manipule des mots de passe et des cles SSH, la nouvelle doit arriver
  # par la CI, pas par un utilisateur.
  #
  # `cargo-deny` couvre a la fois les avis RustSec, les licences, les sources
  # et les doublons (cf. deny.toml). Le job est separe: une faille annoncee un
  # mardi ne doit pas empecher de construire un paquet le mercredi.
  # ---------------------------------------------------------------------------
  audit:
    name: Audit des dependances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `--locked` installe la version que le Cargo.lock de l'outil fige: le
      # verificateur ne doit pas etre le maillon qui bouge tout seul.
      - name: Outils d'audit
        run: cargo install --locked cargo-audit cargo-deny

      # Bloquant sur ce qui se corrige: une vulnerabilite (comportement par
      # defaut), une caisse retiree de crates.io, un defaut de surete. Pas sur
      # `unmaintained`: qu'une dependance transitive soit abandonnee ne se
      # corrige pas en montant une version, et une CI rouge sur un motif qu'on
      # ne peut pas traiter est une CI qu'on apprend a ignorer. `cargo deny` le
      # rapporte en avertissement.
      - name: cargo audit
        run: cargo audit --deny unsound --deny yanked

      - name: cargo deny
        run: cargo deny check

  linux:
    name: Linux — binaire, .deb, .rpm et AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb-xkb-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config \
            xvfb fonts-dejavu-core file rpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Outils de packaging
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: cargo build --release
        run: cargo build --release

      # Un binaire qui compile mais panique au demarrage passerait sinon
      # inapercu: on ouvre reellement la fenetre sur un serveur X virtuel.
      - name: Test de demarrage headless
        run: ./.github/scripts/smoke-test.sh target/release/sshpass-gui

      - name: Paquet Debian
        run: cargo deb --no-build

      - name: Paquet RPM
        run: cargo generate-rpm

      # -------------------------------------------------------------------
      # Les outils AppImage sont telecharges puis **executes** sur le runner,
      # avec acces au workspace et a l'environnement du job. Deux precautions:
      #
      # * une version figee au lieu de `continuous`, une etiquette qui bouge
      #   a chaque construction amont;
      # * un SHA256 verifie avant le premier `chmod +x`. Sans lui, epingler la
      #   version ne protege de rien: le fichier servi sous une etiquette peut
      #   etre remplace.
      #
      # Mettre a jour l'outil, c'est changer la version **et** l'empreinte,
      # dans le meme commit, apres l'avoir recalculee soi-meme.
      # -------------------------------------------------------------------
      - name: AppImage
        env:
          # Les runners GitHub n'ont pas FUSE: les outils AppImage doivent
          # s'extraire eux-memes au lieu de se monter.
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
          LINUXDEPLOY_VERSION: 1-alpha-20250213-2
          LINUXDEPLOY_SHA256: 4648f278ab3ef31f819e67c30d50f462640e5365a77637d7e6f2ad9fd0b4522a
          LINUXDEPLOY_PLUGIN_VERSION: 1-alpha-20250213-1
          LINUXDEPLOY_PLUGIN_SHA256: 992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3
        run: |
          set -eu
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy \
            "$base/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage"
          curl -fsSLo linuxdeploy-plugin-appimage \
            "$base/linuxdeploy-plugin-appimage/releases/download/$LINUXDEPLOY_PLUGIN_VERSION/linuxdeploy-plugin-appimage-x86_64.AppImage"
          # Verifie avant d'etre rendu executable, jamais apres.
          printf '%s  linuxdeploy\n%s  linuxdeploy-plugin-appimage\n' \
            "$LINUXDEPLOY_SHA256" "$LINUXDEPLOY_PLUGIN_SHA256" > linuxdeploy.sha256
          sha256sum -c linuxdeploy.sha256
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          export PATH="$PWD:$PATH"
          # linuxdeploy ne connait que binaire, .desktop et icone: le
          # metainfo est depose a la main, a l'emplacement ou les logitheques
          # le cherchent une fois l'AppImage integree.
          install -Dm644 packaging/io.github.memton80.sshpass-gui.metainfo.xml \
            AppDir/usr/share/metainfo/io.github.memton80.sshpass-gui.metainfo.xml
          ./linuxdeploy --appdir AppDir \
            -e target/release/sshpass-gui \
            -d packaging/sshpass-gui.desktop \
            -i packaging/sshpass-gui.png
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          OUTPUT="sshpass-gui-${version}-x86_64.AppImage" ./linuxdeploy-plugin-appimage --appdir AppDir

      # Meme exigence pour l'AppImage que pour le binaire nu: elle doit
      # demarrer, pas seulement se construire.
      - name: Test de demarrage de l'AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./.github/scripts/smoke-test.sh ./sshpass-gui-*-x86_64.AppImage

      - name: Recapitulatif des paquets
        run: |
          mkdir -p dist
          cp target/release/sshpass-gui dist/sshpass-gui-x86_64-linux
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          cp sshpass-gui-*-x86_64.AppImage dist/
          ls -la dist/
          for f in dist/*; do echo "--- $f"; file -b "$f"; done

      # Les empreintes accompagnent les paquets: qui les recupere doit pouvoir
      # verifier qu'il tient bien ce que la CI a produit.
      - name: Empreintes des paquets
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Un asset oublie dans Cargo.toml ne casse aucune compilation: il rend
      # seulement l'application anonyme dans les logitheques. On verifie donc
      # que le fichier est bien dans les paquets livres.
      - name: Metadonnees presentes dans les paquets
        run: |
          set -euo pipefail
          metainfo=usr/share/metainfo/io.github.memton80.sshpass-gui.metainfo.xml
          # Sortie dans un fichier plutot que dans un tube: `grep -q` s'arrete
          # des la premiere correspondance et tuerait l'outil en amont.
          dpkg-deb --contents dist/*.deb > deb-contents.txt
          rpm -qlp dist/*.rpm > rpm-contents.txt
          grep -q "$metainfo" deb-contents.txt
          grep -q "/$metainfo" rpm-contents.txt
          echo "metainfo present dans le .deb et le .rpm"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sshpass-gui-linux-x86_64
          path: dist/*
          if-no-files-found: error
