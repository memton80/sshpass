name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb-xkb-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

      # Les metadonnees des logitheques sont un fichier qu'aucun test Rust ne
      # touche: une faute de frappe n'apparaitrait qu'apres installation, dans
      # Discover. On les valide donc ici, avec les outils de reference.
      - name: Metadonnees des logitheques
        run: |
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          desktop-file-validate packaging/sshpass-gui.desktop
          appstreamcli validate --no-net --pedantic \
            packaging/io.github.memton80.sshpass-gui.metainfo.xml
          # La version annoncee aux logitheques doit suivre celle de la caisse,
          # sinon la logitheque affiche une version et le paquet une autre.
          crate=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if ! grep -q "<release version=\"$crate\"" \
              packaging/io.github.memton80.sshpass-gui.metainfo.xml; then
            echo "::error::metainfo sans entree <release> pour la version $crate"
            exit 1
          fi

  linux:
    name: Linux — binaire, .deb, .rpm et AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb-xkb-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config \
            xvfb fonts-dejavu-core file rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Outils de packaging
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: cargo build --release
        run: cargo build --release

      # Un binaire qui compile mais panique au demarrage passerait sinon
      # inapercu: on ouvre reellement la fenetre sur un serveur X virtuel.
      - name: Test de demarrage headless
        run: ./.github/scripts/smoke-test.sh target/release/sshpass-gui

      - name: Paquet Debian
        run: cargo deb --no-build

      - name: Paquet RPM
        run: cargo generate-rpm

      - name: AppImage
        env:
          # Les runners GitHub n'ont pas FUSE: les outils AppImage doivent
          # s'extraire eux-memes au lieu de se monter.
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          set -eu
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy \
            "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSLo linuxdeploy-plugin-appimage \
            "$base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          export PATH="$PWD:$PATH"
          # linuxdeploy ne connait que binaire, .desktop et icone: le
          # metainfo est depose a la main, a l'emplacement ou les logitheques
          # le cherchent une fois l'AppImage integree.
          install -Dm644 packaging/io.github.memton80.sshpass-gui.metainfo.xml \
            AppDir/usr/share/metainfo/io.github.memton80.sshpass-gui.metainfo.xml
          ./linuxdeploy --appdir AppDir \
            -e target/release/sshpass-gui \
            -d packaging/sshpass-gui.desktop \
            -i packaging/sshpass-gui.png
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          OUTPUT="sshpass-gui-${version}-x86_64.AppImage" ./linuxdeploy-plugin-appimage --appdir AppDir

      # Meme exigence pour l'AppImage que pour le binaire nu: elle doit
      # demarrer, pas seulement se construire.
      - name: Test de demarrage de l'AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./.github/scripts/smoke-test.sh ./sshpass-gui-*-x86_64.AppImage

      - name: Recapitulatif des paquets
        run: |
          mkdir -p dist
          cp target/release/sshpass-gui dist/sshpass-gui-x86_64-linux
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          cp sshpass-gui-*-x86_64.AppImage dist/
          ls -la dist/
          for f in dist/*; do echo "--- $f"; file -b "$f"; done

      # Un asset oublie dans Cargo.toml ne casse aucune compilation: il rend
      # seulement l'application anonyme dans les logitheques. On verifie donc
      # que le fichier est bien dans les paquets livres.
      - name: Metadonnees presentes dans les paquets
        run: |
          set -euo pipefail
          metainfo=usr/share/metainfo/io.github.memton80.sshpass-gui.metainfo.xml
          # Sortie dans un fichier plutot que dans un tube: `grep -q` s'arrete
          # des la premiere correspondance et tuerait l'outil en amont.
          dpkg-deb --contents dist/*.deb > deb-contents.txt
          rpm -qlp dist/*.rpm > rpm-contents.txt
          grep -q "$metainfo" deb-contents.txt
          grep -q "/$metainfo" rpm-contents.txt
          echo "metainfo present dans le .deb et le .rpm"


      - uses: actions/upload-artifact@v4
        with:
          name: sshpass-gui-linux-x86_64
          path: dist/*
          if-no-files-found: error
