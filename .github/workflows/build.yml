name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-xkb-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

  build:
    name: Binaire release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-xkb-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            pkg-config \
            xvfb \
            fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      # Verifie que le binaire demarre vraiment: la fenetre s'ouvre, les
      # polices systeme se chargent et la boucle de rendu tourne. Un binaire
      # qui compile mais panique au demarrage passerait sinon inapercu.
      - name: Test de demarrage headless
        run: |
          set -eu
          export SSHPASS_CONFIG="$RUNNER_TEMP/sshpass-smoke.toml"
          printf 'version = 1\n' > "$SSHPASS_CONFIG"
          binary="target/${{ matrix.target }}/release/sshpass"
          xvfb-run -a --server-args="-screen 0 1280x800x24" "$binary" &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "L'application tourne toujours apres 15 s: demarrage correct."
            kill "$pid"
            wait "$pid" 2>/dev/null || true
          else
            echo "::error::L'application s'est arretee pendant le test de demarrage."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sshpass-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/sshpass
          if-no-files-found: error
