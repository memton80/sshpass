name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb-xkb-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  linux:
    name: Linux — binaire, .deb, .rpm et AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb-xkb-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config \
            xvfb fonts-dejavu-core file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Outils de packaging
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: cargo build --release
        run: cargo build --release

      # Un binaire qui compile mais panique au demarrage passerait sinon
      # inapercu: on ouvre reellement la fenetre sur un serveur X virtuel.
      - name: Test de demarrage headless
        run: ./.github/scripts/smoke-test.sh target/release/sshpass

      - name: Paquet Debian
        run: cargo deb --no-build

      - name: Paquet RPM
        run: cargo generate-rpm

      - name: AppImage
        env:
          # Les runners GitHub n'ont pas FUSE: les outils AppImage doivent
          # s'extraire eux-memes au lieu de se monter.
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          set -eu
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy \
            "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSLo linuxdeploy-plugin-appimage \
            "$base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          export PATH="$PWD:$PATH"
          ./linuxdeploy --appdir AppDir \
            -e target/release/sshpass \
            -d packaging/sshpass.desktop \
            -i packaging/sshpass.png
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          OUTPUT="sshpass-${version}-x86_64.AppImage" ./linuxdeploy-plugin-appimage --appdir AppDir

      # Meme exigence pour l'AppImage que pour le binaire nu: elle doit
      # demarrer, pas seulement se construire.
      - name: Test de demarrage de l'AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./.github/scripts/smoke-test.sh ./sshpass-*-x86_64.AppImage

      - name: Recapitulatif des paquets
        run: |
          mkdir -p dist
          cp target/release/sshpass dist/sshpass-x86_64-linux
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          cp sshpass-*-x86_64.AppImage dist/
          ls -la dist/
          for f in dist/*; do echo "--- $f"; file -b "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: sshpass-linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows — sshpass.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo build --release
        run: cargo build --release

      # Verifie que l'executable demarre: une DLL manquante ou une panique
      # au lancement ne se voit pas a la compilation.
      - name: Test de demarrage
        shell: pwsh
        run: |
          $exe = "target\release\sshpass.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            Write-Error "L'application s'est arretee (code $($process.ExitCode))."
            exit 1
          }
          Write-Host "L'application tourne toujours apres 15 s: demarrage correct."
          Stop-Process -Id $process.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: sshpass-x86_64-windows
          path: target/release/sshpass.exe
          if-no-files-found: error
